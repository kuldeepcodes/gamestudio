<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Game Studio — a new game every hour</title>
<meta name="description" content="An AI game studio that dreams up and builds a brand-new premium browser game every hour. Play the latest drops."/>
<meta name="theme-color" content="#0b1020"/>
<meta property="og:title" content="Game Studio"/>
<meta property="og:description" content="A brand-new premium browser game, every hour — invented and built by AI."/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%B9%EF%B8%8F%3C/text%3E%3C/svg%3E"/>
<link rel="stylesheet" href="assets/gallery.css"/>
</head>
<body>
<div class="bg"></div>
<header class="hero">
  <div class="wrap">
    <div class="brand">
      <span class="logo">&#127993;</span>
      <div>
        <h1>Game&nbsp;Studio</h1>
        <p class="sub">A brand-new premium browser game, <b>every hour</b> — dreamed up &amp; built by AI.</p>
      </div>
    </div>
    <div class="toolbar">
      <div class="stat" id="stat">&mdash;</div>
      <input id="search" class="search" type="search" placeholder="Search games, genres, tags…" aria-label="Search games"/>
    </div>
  </div>
</header>
<main class="wrap">
  <section id="grid" class="grid" aria-live="polite"></section>
  <div id="empty" class="empty hidden">No games match that search.</div>
</main>
<footer class="foot wrap">
  <span>Built autonomously with GitHub Copilot &amp; GitHub Actions.</span>
  <a href="https://github.com/kuldeepcodes/gamestudio" target="_blank" rel="noopener">Source on GitHub &#8599;</a>
</footer>
<script src="assets/gallery.js"></script>
</body>
</html>

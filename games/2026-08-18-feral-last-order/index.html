<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
<meta name="theme-color" content="#0a0416"/>
<title>Feral Last Order</title>
<meta name="description" content="Feral Last Order — a vaporwave sunset cafe order assembly game. You're on bar during the morning rush. Build each drink by adding its ingredients in the exact order on the ticket, before the customer walks."/>
<meta property="og:title" content="Feral Last Order"/>
<meta property="og:description" content="Feral Last Order — a vaporwave sunset cafe order assembly game. You're on bar during the morning rush. Build each drink by adding its ingredients in the exact order on the ticket, before the customer walks."/>
<style>/* GameStudio premium shell — themeable via CSS variables set from each game's meta.
   No external dependencies (no web fonts, images or network) so every game is offline-ready. */
:root{
  --accent:#6ee7ff; --accent2:#a78bfa;
  --bg:#0b1020; --bg2:#131a33;
  --ink:#eaf0ff; --muted:#93a0c8;
  --panel:rgba(18,24,48,.72); --stroke:rgba(255,255,255,.10);
  --radius:20px; --shadow:0 24px 70px rgba(0,0,0,.55);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;z-index:0;overflow:hidden;background:
   radial-gradient(1200px 800px at 15% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%),
   radial-gradient(1000px 900px at 110% 20%, color-mix(in srgb, var(--accent2) 22%, transparent), transparent 55%),
   linear-gradient(160deg, var(--bg), var(--bg2))}
.bg::after{content:"";position:absolute;inset:-40%;
  background:conic-gradient(from 0deg, transparent 0 40%, color-mix(in srgb,var(--accent) 8%, transparent) 50%, transparent 60% 100%);
  animation:spin 26s linear infinite;filter:blur(30px);opacity:.5}
@keyframes spin{to{transform:rotate(360deg)}}
.stage{position:relative;z-index:1;width:min(96vw,520px);aspect-ratio:var(--aspect,2/3);
  max-height:88vh;border-radius:var(--radius);overflow:hidden;background:rgba(4,7,18,.55);
  border:1px solid var(--stroke);box-shadow:var(--shadow)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:12px 14px;background:linear-gradient(180deg,rgba(4,7,18,.55),transparent);pointer-events:none}
.hud .icon-btn{pointer-events:auto}
.hud-title{font-weight:700;font-size:14px;letter-spacing:.4px;opacity:.9;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:38%}
.hud-scores{display:flex;gap:8px;margin-left:auto}
.chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;
  background:rgba(255,255,255,.06);border:1px solid var(--stroke);font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
.chip-label{font-size:9px;letter-spacing:1.5px;color:var(--muted);font-weight:800}
.hud-actions{display:flex;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer;font-size:13px;display:grid;place-items:center;transition:.15s}
.icon-btn:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.icon-btn.off{opacity:.4}
/* always-available way back to the gallery while playing */
.back-btn{text-decoration:none;font-size:17px;font-weight:800;line-height:1;flex:0 0 auto}
.back-btn:hover{background:rgba(255,255,255,.16);color:var(--accent)}
.overlay{position:absolute;inset:0;z-index:4;display:grid;place-items:center;padding:22px;
  background:radial-gradient(120% 120% at 50% 0%, rgba(4,7,18,.30), rgba(4,7,18,.78));animation:fade .3s ease}
.overlay.hidden{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{width:100%;max-width:360px;text-align:center;padding:26px 22px;border-radius:var(--radius);
  background:var(--panel);border:1px solid var(--stroke);box-shadow:var(--shadow);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:pop .35s cubic-bezier(.2,.9,.25,1.2)}
@keyframes pop{from{transform:translateY(10px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.game-name{margin:0 0 6px;font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{margin:0 0 14px;opacity:.92;font-size:14px;font-weight:600}
.how{margin:0 0 20px;color:var(--muted);font-size:13px;line-height:1.5}
h2{margin:0 0 16px;font-size:22px;font-weight:800}
.cta{appearance:none;border:none;cursor:pointer;width:100%;padding:14px 18px;border-radius:14px;font-weight:800;
  font-size:16px;color:#04121b;letter-spacing:.3px;background:linear-gradient(120deg,var(--accent),var(--accent2));
  box-shadow:0 12px 30px color-mix(in srgb,var(--accent) 40%, transparent);transition:.15s}
.cta:hover{transform:translateY(-2px);filter:brightness(1.05)}
.cta:active{transform:translateY(0)}
.ghost{margin-top:10px;appearance:none;cursor:pointer;width:100%;padding:12px;border-radius:12px;background:transparent;
  border:1px solid var(--stroke);color:var(--muted);font-weight:700;font-size:14px;
  display:block;box-sizing:border-box;text-align:center;text-decoration:none;font-family:inherit}
.ghost:hover{color:var(--ink);border-color:var(--accent)}
.hint{margin-top:16px;color:var(--muted);font-size:11px;letter-spacing:.3px;line-height:1.6}
.final{display:flex;gap:14px;justify-content:center;margin-bottom:20px}
.final>div{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--stroke);border-radius:14px;padding:12px}
.big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.credit{position:relative;z-index:1;margin-top:14px;display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12px}
.credit a{color:var(--muted);text-decoration:none;font-weight:700}
.credit a:hover{color:var(--accent)}
#madeTag{opacity:.6}
@media (max-width:520px){
  .game-name{font-size:26px}
  .hud{gap:8px;padding:10px 10px}
  .hud-title{max-width:26%;font-size:13px}
  .chip{padding:5px 8px}
}
/* comfortable tap targets on touch devices (Apple/Google guidance is ~44px) */
@media (hover:none){
  .icon-btn{width:42px;height:42px;font-size:15px}
  .back-btn{font-size:20px}
  .icon-btn:hover{transform:none}
  .cta:hover{transform:none}
}
/* very short landscape: keep the whole panel reachable without scrolling */
@media (max-height:420px){
  .panel{padding:16px 18px;max-height:92vh;overflow:auto}
  .game-name{font-size:22px}
  .how{margin-bottom:12px}
  .final{margin-bottom:12px}
  .cta{padding:11px 16px}
}
</style>
</head>
<body>
<div class="app">
  <div class="bg"></div>
  <main class="stage" id="stage">
    <canvas id="game"></canvas>
    <header class="hud">
      <a class="icon-btn back-btn" id="backBtn" href="../../" title="All games" aria-label="Back to Game Studio">&#8592;</a>
      <div class="hud-title" id="hudTitle">Game</div>
      <div class="hud-scores">
        <div class="chip"><span class="chip-label">SCORE</span><span id="score">0</span></div>
        <div class="chip"><span class="chip-label">BEST</span><span id="best">0</span></div>
      </div>
      <div class="hud-actions">
        <button class="icon-btn" id="muteBtn" title="Mute (M)" aria-label="Toggle sound">&#9834;</button>
        <button class="icon-btn" id="pauseBtn" title="Pause (P)" aria-label="Pause">&#10073;&#10073;</button>
      </div>
    </header>
    <div class="overlay" id="overlayTitle">
      <div class="panel">
        <h1 class="game-name" id="titleName">Game</h1>
        <p class="tagline" id="titleTag"></p>
        <p class="how" id="titleHow"></p>
        <button class="cta" id="playBtn">Play</button>
        <div class="hint" id="controlHint"></div>
      </div>
    </div>
    <div class="overlay hidden" id="overlayPause">
      <div class="panel">
        <h2>Paused</h2>
        <button class="cta" id="resumeBtn">Resume</button>
        <button class="ghost" id="restartBtn">Restart</button>
      </div>
    </div>
    <div class="overlay hidden" id="overlayOver">
      <div class="panel">
        <h2 id="overTitle">Game Over</h2>
        <div class="final">
          <div><span class="chip-label">SCORE</span><div class="big" id="finalScore">0</div></div>
          <div><span class="chip-label">BEST</span><div class="big" id="finalBest">0</div></div>
        </div>
        <button class="cta" id="againBtn">Play Again</button>
        <a class="ghost" id="moreBtn" href="../../">&#127918; Play another game</a>
      </div>
    </div>
  </main>
  <footer class="credit"><a id="galleryLink" href="../../">&#8592; Game Studio</a><span id="madeTag">auto-generated</span></footer>
</div>
<script>/* GameStudio engine — a compact, dependency-free arcade runtime.
 * It owns the premium shell: responsive canvas, game loop, scenes (title/play/pause/over),
 * score + best (localStorage), keyboard + touch input, WebAudio SFX, particles and screen shake.
 * A game is a small module on window.GAME = { meta, create(engine) -> instance }.
 * The instance may implement: setup(), reset(), update(dt), render(ctx), onResize(w,h).
 */
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  var lerp = function (a, b, t) { return a + (b - a) * t; };
  var dist = function (x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); };
  function makeRng(seed) {
    var s = (seed >>> 0) || 123456789;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var Sound = (function () {
    var ctx = null, muted = false;
    try { muted = localStorage.getItem("gs:muted") === "1"; } catch (e) {}
    function ensure() {
      if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      if (ctx && ctx.state === "suspended") { ctx.resume(); }
    }
    function tone(freq, dur, type, vol, slideTo) {
      if (muted) return; ensure(); if (!ctx) return;
      var t0 = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || "square"; o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0 + dur + 0.03);
    }
    return {
      ensure: ensure,
      isMuted: function () { return muted; },
      setMuted: function (v) { muted = v; try { localStorage.setItem("gs:muted", v ? "1" : "0"); } catch (e) {} },
      blip: function () { tone(520, 0.08, "square", 0.10, 680); },
      hit: function () { tone(170, 0.16, "sawtooth", 0.16, 80); },
      coin: function () { tone(740, 0.07, "square", 0.10); setTimeout(function () { tone(988, 0.10, "square", 0.10); }, 70); },
      power: function () { tone(392, 0.10, "triangle", 0.13); setTimeout(function () { tone(659, 0.12, "triangle", 0.13); }, 90); },
      jump: function () { tone(420, 0.12, "square", 0.11, 760); },
      over: function () { tone(300, 0.5, "sawtooth", 0.17, 60); },
      tick: function () { tone(880, 0.03, "square", 0.06); },
      tone: tone
    };
  })();

  function Particles() {
    var ps = [];
    return {
      burst: function (x, y, o) {
        o = o || {}; var n = o.count || 14;
        for (var i = 0; i < n; i++) {
          var a = (o.angle == null) ? Math.random() * 6.283 : o.angle + (Math.random() - 0.5) * (o.spread || 6.283);
          var sp = (o.speed || 130) * (0.4 + Math.random() * 0.9);
          ps.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: o.life || 0.6, age: 0,
            size: o.size || 3, color: o.color || "#fff", g: o.gravity == null ? 220 : o.gravity });
        }
      },
      update: function (dt) {
        for (var i = ps.length - 1; i >= 0; i--) {
          var p = ps[i]; p.age += dt;
          if (p.age >= p.life) { ps.splice(i, 1); continue; }
          p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
        }
      },
      render: function (ctx) {
        for (var i = 0; i < ps.length; i++) {
          var p = ps[i], k = 1 - p.age / p.life;
          ctx.globalAlpha = Math.max(0, k); ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.5, p.size * k), 0, 6.283); ctx.fill();
        }
        ctx.globalAlpha = 1;
      },
      clear: function () { ps.length = 0; }
    };
  }

  function Input(canvas, getLogical) {
    var down = {}, pressed = {};
    var pointer = { x: 0, y: 0, down: false, justDown: false, justUp: false, dx: 0, dy: 0 };
    var swipe = null, sx = 0, sy = 0, stime = 0;
    var map = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
      ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
      Space: "action", Enter: "action", KeyK: "action2", KeyJ: "action" };
    addEventListener("keydown", function (e) {
      var k = map[e.code]; if (k) { if (!down[k]) pressed[k] = true; down[k] = true;
        if (k !== "action2") e.preventDefault(); }
    });
    addEventListener("keyup", function (e) { var k = map[e.code]; if (k) down[k] = false; });
    function toLogical(cx, cy) {
      var r = canvas.getBoundingClientRect(), L = getLogical();
      var w = r.width || 1, h = r.height || 1;
      return { x: (cx - r.left) / w * L.w, y: (cy - r.top) / h * L.h };
    }
    function dn(e) { var t = e.touches ? e.touches[0] : e; var p = toLogical(t.clientX, t.clientY);
      pointer.x = p.x; pointer.y = p.y; pointer.down = true; pointer.justDown = true;
      sx = p.x; sy = p.y; stime = performance.now(); if (e.cancelable) e.preventDefault(); }
    function mv(e) { if (!pointer.down && !e.touches) return; var t = e.touches ? e.touches[0] : e;
      var p = toLogical(t.clientX, t.clientY); pointer.dx = p.x - pointer.x; pointer.dy = p.y - pointer.y;
      pointer.x = p.x; pointer.y = p.y; if (e.cancelable) e.preventDefault(); }
    function up(e) { pointer.down = false; pointer.justUp = true;
      var d = performance.now() - stime, dx = pointer.x - sx, dy = pointer.y - sy;
      if (d < 520 && Math.hypot(dx, dy) > 26) {
        swipe = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      }
      if (e && e.cancelable) e.preventDefault(); }
    canvas.addEventListener("mousedown", dn); addEventListener("mousemove", mv); addEventListener("mouseup", up);
    canvas.addEventListener("touchstart", dn, { passive: false });
    canvas.addEventListener("touchmove", mv, { passive: false });
    canvas.addEventListener("touchend", up, { passive: false });
    var api = {
      isDown: function (k) { return !!down[k]; },
      justPressed: function (k) { return !!pressed[k]; },
      pointer: pointer,
      dir: function () { return { x: (down.right ? 1 : 0) - (down.left ? 1 : 0), y: (down.down ? 1 : 0) - (down.up ? 1 : 0) }; },
      consumeSwipe: function () { var s = swipe; swipe = null; return s; },
      _end: function () { for (var k in pressed) delete pressed[k]; pointer.justDown = false; pointer.justUp = false; pointer.dx = 0; pointer.dy = 0; }
    };
    return api;
  }

  var Shell = {
    boot: function (GAME) {
      var meta = Object.assign({ title: "Game", tagline: "", instructions: "", accent: "#6ee7ff",
        accent2: "#a78bfa", bg: "#0b1020", width: 480, height: 720 }, (GAME && GAME.meta) || {});
      var parts = location.pathname.split("/").filter(Boolean);
      var id = meta.id || parts[parts.length - 2] || meta.title;
      var rs = document.documentElement.style;
      rs.setProperty("--accent", meta.accent); rs.setProperty("--accent2", meta.accent2);
      rs.setProperty("--bg", meta.bg); rs.setProperty("--aspect", meta.width + "/" + meta.height);
      document.title = meta.title + " \u00b7 Game Studio";
      $("hudTitle").textContent = meta.title;
      $("titleName").textContent = meta.title;
      $("titleTag").textContent = meta.tagline;
      $("titleHow").textContent = meta.instructions;
      $("controlHint").innerHTML = (meta.controls || "Arrow keys / WASD / Swipe &nbsp;\u00b7&nbsp; Space / Tap to act") + "<br>P pause &nbsp;\u00b7&nbsp; M mute";
      $("madeTag").textContent = meta.date ? ("generated " + meta.date) : "auto-generated";

      var canvas = $("game"), ctx = canvas.getContext("2d");
      var W = meta.width, H = meta.height, dpr = 1;
      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (game && game.onResize) { try { game.onResize(W, H); } catch (e) {} }
      }
      var particles = Particles();
      var input = Input(canvas, function () { return { w: W, h: H }; });
      var rng = makeRng((meta.seed || Date.now()) >>> 0);
      var best = 0; try { best = parseInt(localStorage.getItem("gs:hi:" + id) || "0", 10) || 0; } catch (e) {}
      $("best").textContent = best; $("finalBest").textContent = best;

      var shake = 0, scene = "title";
      var engine = {
        canvas: canvas, ctx: ctx, width: W, height: H, W: W, H: H,
        input: input, particles: particles, sound: Sound, rng: rng,
        clamp: clamp, lerp: lerp, dist: dist,
        rand: function (a, b) { return a + (b - a) * rng(); },
        randInt: function (a, b) { return Math.floor(a + (b - a + 1) * rng()); },
        chance: function (p) { return rng() < p; },
        pick: function (arr) { return arr[Math.floor(rng() * arr.length)]; },
        score: 0, best: best,
        addScore: function (n) { this.score += n; $("score").textContent = this.score; },
        setScore: function (n) { this.score = n; $("score").textContent = this.score; },
        shake: function (a) { shake = Math.max(shake, a || 8); },
        gameOver: function () {
          if (scene !== "playing") return; setScene("over"); Sound.over();
          if (this.score > best) { best = this.score; try { localStorage.setItem("gs:hi:" + id, String(best)); } catch (e) {} }
          this.best = best; $("finalScore").textContent = this.score;
          $("finalBest").textContent = best; $("best").textContent = best;
        }
      };

      var game = GAME.create(engine);

      function setScene(s) {
        scene = s;
        $("overlayTitle").classList.toggle("hidden", s !== "title");
        $("overlayPause").classList.toggle("hidden", s !== "paused");
        $("overlayOver").classList.toggle("hidden", s !== "over");
      }
      function start() {
        engine.setScore(0); particles.clear(); shake = 0;
        (game.reset || game.setup || function () {}).call(game);
        setScene("playing"); Sound.ensure();
      }
      $("playBtn").onclick = function () { Sound.ensure(); start(); };
      $("againBtn").onclick = function () { start(); };
      $("resumeBtn").onclick = function () { setScene("playing"); };
      $("restartBtn").onclick = function () { start(); };
      $("pauseBtn").onclick = function () { if (scene === "playing") setScene("paused"); else if (scene === "paused") setScene("playing"); };
      var muteBtn = $("muteBtn");
      function syncMute() { muteBtn.classList.toggle("off", Sound.isMuted()); muteBtn.textContent = Sound.isMuted() ? "\uD83D\uDD07" : "\u266A"; }
      muteBtn.onclick = function () { Sound.setMuted(!Sound.isMuted()); syncMute(); }; syncMute();
      addEventListener("keydown", function (e) {
        if (e.code === "KeyP") { if (scene === "playing") setScene("paused"); else if (scene === "paused") setScene("playing"); }
        else if (e.code === "KeyM") { Sound.setMuted(!Sound.isMuted()); syncMute(); }
        else if (e.code === "Space" || e.code === "Enter") { if (scene === "title" || scene === "over") start(); }
      });

      if (game.setup) { try { game.setup(); } catch (e) { console.error(e); } }
      resize(); addEventListener("resize", resize);
      setScene("title");

      var last = performance.now();
      function frame(now) {
        var dt = (now - last) / 1000; last = now; if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
        if (scene === "playing") { try { game.update(dt); } catch (err) { console.error(err); } particles.update(dt); }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, W, H);
        var didShake = false;
        if (shake > 0) { didShake = true; var ox = (rng() * 2 - 1) * shake, oy = (rng() * 2 - 1) * shake;
          shake *= 0.86; if (shake < 0.4) shake = 0; ctx.save(); ctx.translate(ox, oy); }
        try { game.render(ctx); } catch (err) { console.error(err); }
        particles.render(ctx);
        if (didShake) ctx.restore();
        input._end();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }
  };
  window.GameShell = Shell;
})();
</script>
<script>window.GAME = {
  meta: {
    "title": "Feral Last Order",
    "tagline": "Flow state, unlocked.",
    "description": "Feral Last Order — a vaporwave sunset cafe order assembly game. You're on bar during the morning rush. Build each drink by adding its ingredients in the exact order on the ticket, before the customer walks.",

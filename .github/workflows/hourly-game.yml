name: Game drop

on:
  schedule:
    # Every 4 hours at :23 (00:23, 04:23, 08:23, 12:23, 16:23, 20:23 UTC).
    # The minute is deliberately off the top of the hour: that is GitHub's most
    # congested cron slot, where scheduled runs are most often delayed or dropped.
    # Change the hour field to alter the cadence, e.g.
    #   "23 * * * *"    hourly            "23 */2 * * *"  every 2 hours
    #   "23 */6 * * *"  every 6 hours     "23 9 * * *"    once a day at 09:23
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Override model (e.g. openai/gpt-4o, openai/gpt-4o-mini)"
        required: false
        type: string
      seed:
        description: "Optional numeric creativity seed (for reproducing a brief)"
        required: false
        type: string

# Only needs to commit to main — no pull requests are created.
permissions:
  contents: write

# Runs are serialised so two drops can never race each other to push main.
concurrency:
  group: hourly-game
  cancel-in-progress: false

jobs:
  drop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history so the drop can rebase onto main if it moved mid-run
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tooling
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Generate a new game
        id: gen
        env:
          GS_MODEL: ${{ inputs.model }}
          GS_SEED: ${{ inputs.seed }}
          # Cap how many games may share one mechanic. Unset = keep every game (default).
          # Setting this DELETES older games of the same mechanic, and drops now land on
          # main unreviewed, so enable it only if you want the gallery pruned automatically.
          #   GS_MAX_PER_MECHANIC: "1"
          # Default backend is a local procedural generator (no key needed).
          # Optional: set repo secrets to author games with your own OpenAI-compatible model instead.
          GS_LLM_KEY: ${{ secrets.GS_LLM_KEY }}
          GS_LLM_ENDPOINT: ${{ secrets.GS_LLM_ENDPOINT }}
        run: node scripts/generate-game.mjs

      # The engine and shell are inlined into each game at build time, so a game
      # generated before an engine change but merged after it keeps the old shell.
      # Rebuilding here is byte-stable (no diff unless engine/ actually changed), so
      # a drop quietly brings any stale page back in line instead of it going unnoticed.
      - name: Refresh games against the current engine
        if: steps.gen.outputs.created == 'true'
        run: node scripts/rebuild-all.mjs

      - name: Commit and push to main
        if: steps.gen.outputs.created == 'true'
        env:
          TITLE: ${{ steps.gen.outputs.title }}
          EMOJI: ${{ steps.gen.outputs.emoji }}
          SLUG: ${{ steps.gen.outputs.slug }}
          GENRE: ${{ steps.gen.outputs.genre }}
          THEME: ${{ steps.gen.outputs.theme }}
          RETIRED: ${{ steps.gen.outputs.retired }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # -A so retirements (deletions) are staged too, not just additions
          git add -A -- games games.json

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          {
            echo "feat(game): $TITLE $EMOJI"
            echo
            echo "Genre: $GENRE | Theme: $THEME | Folder: games/$SLUG/"
            if [ -n "${RETIRED:-}" ]; then echo "Retires: $RETIRED"; fi
            echo
            echo "Generated and smoke-tested automatically by .github/workflows/hourly-game.yml."
          } > /tmp/commit-msg.txt

          git commit -F /tmp/commit-msg.txt

          # main may have moved while this run was working (a manual push, or a
          # long-running drop). Rebase onto it and retry rather than failing the drop.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Published to main on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main and retrying."
            git fetch origin main
            # keep our generated files if the same paths were touched upstream
            git rebase origin/main || { git rebase --abort; echo "Rebase failed."; exit 1; }
            sleep $((attempt * 3))
          done
          echo "Could not push to main after 5 attempts."
          exit 1

      - name: Summary
        if: steps.gen.outputs.created == 'true'
        env:
          TITLE: ${{ steps.gen.outputs.title }}
          EMOJI: ${{ steps.gen.outputs.emoji }}
          TAGLINE: ${{ steps.gen.outputs.tagline }}
          SLUG: ${{ steps.gen.outputs.slug }}
          GENRE: ${{ steps.gen.outputs.genre }}
          THEME: ${{ steps.gen.outputs.theme }}
          RETIRED: ${{ steps.gen.outputs.retired }}
        run: |
          {
            echo "### $EMOJI $TITLE"
            echo "> $TAGLINE"
            echo
            echo "- **Genre:** $GENRE"
            echo "- **Theme:** $THEME"
            echo "- **Folder:** \`games/$SLUG/\`"
            echo "- **Retired:** ${RETIRED:-nothing}"
            echo
            echo "Published straight to \`main\` — GitHub Pages redeploys automatically."
            echo
            echo "**Play:** https://kuldeepcodes.github.io/gamestudio/games/$SLUG/"
          } >> "$GITHUB_STEP_SUMMARY"

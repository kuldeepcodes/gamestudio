name: Game drop

on:
  schedule:
    # Every 4 hours at :23 (00:23, 04:23, 08:23, 12:23, 16:23, 20:23 UTC).
    # The minute is deliberately off the top of the hour: that is GitHub's most
    # congested cron slot, where scheduled runs are most often delayed or dropped.
    # Change the hour field to alter the cadence, e.g.
    #   "23 * * * *"    hourly            "23 */2 * * *"  every 2 hours
    #   "23 */6 * * *"  every 6 hours     "23 9 * * *"    once a day at 09:23
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Override model (e.g. openai/gpt-4o, openai/gpt-4o-mini)"
        required: false
        type: string
      seed:
        description: "Optional numeric creativity seed (for reproducing a brief)"
        required: false
        type: string

# Let GITHUB_TOKEN push a branch and open a PR.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hourly-game
  cancel-in-progress: false

jobs:
  drop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Games awaiting review live only on their own branches. Fetch them so the
      # generator can count them and keep rotating instead of repeating an archetype.
      - name: Fetch pending game branches
        run: git fetch --no-tags --depth=1 origin "+refs/heads/game/*:refs/remotes/origin/game/*" || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tooling
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Generate a new game
        id: gen
        env:
          GS_MODEL: ${{ inputs.model }}
          GS_SEED: ${{ inputs.seed }}
          # Default backend is a local procedural generator (no key needed).
          # Optional: set repo secrets to author games with your own OpenAI-compatible model instead.
          GS_LLM_KEY: ${{ secrets.GS_LLM_KEY }}
          GS_LLM_ENDPOINT: ${{ secrets.GS_LLM_ENDPOINT }}
        run: node scripts/generate-game.mjs

      # The engine and shell are inlined into each game at build time, so a game
      # generated before an engine change but merged after it keeps the old shell.
      # Rebuilding here is byte-stable (no diff unless engine/ actually changed), so
      # a drop quietly brings any stale page back in line instead of it going unnoticed.
      - name: Refresh games against the current engine
        if: steps.gen.outputs.created == 'true'
        run: node scripts/rebuild-all.mjs

      - name: Open pull request
        if: steps.gen.outputs.created == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          base: main
          branch: ${{ steps.gen.outputs.branch }}
          delete-branch: true
          add-paths: |
            games/**
            games.json
          commit-message: "feat(game): ${{ steps.gen.outputs.title }} ${{ steps.gen.outputs.emoji }}"
          title: "🎮 New game: ${{ steps.gen.outputs.title }} ${{ steps.gen.outputs.emoji }}"
          labels: |
            game
            automated
          body: |
            ### ${{ steps.gen.outputs.emoji }} ${{ steps.gen.outputs.title }}
            > ${{ steps.gen.outputs.tagline }}

            A fresh, self-contained micro-game — invented and built automatically.

            - **Genre:** ${{ steps.gen.outputs.genre }}
            - **Theme:** ${{ steps.gen.outputs.theme }}
            - **Folder:** `games/${{ steps.gen.outputs.slug }}/`
            - **Retires:** ${{ steps.gen.outputs.retired || 'nothing — this mechanic is new to the gallery' }}

            It already passed an automated headless smoke test (loads, starts, takes input, runs 100+ frames with no errors).

            **Preview locally:** open `games/${{ steps.gen.outputs.slug }}/index.html` in a browser.
            **Publish:** merge this PR — GitHub Pages redeploys and it appears on the gallery homepage.

            _Generated automatically by `.github/workflows/hourly-game.yml`._
